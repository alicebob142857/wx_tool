name: Collect writing examples now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/writing-now.yml"
      - "scripts/seed-writing-seen.ts"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "最多分析多少篇候选文章"
        required: false
        default: "10"
      lookback_hours:
        description: "向前检索多少小时"
        required: false
        default: "336"
      full_history:
        description: "是否忽略时间范围并扫描公众号全部历史"
        required: false
        default: "true"
      history_pages:
        description: "最多读取多少页历史（每页20条发布记录）"
        required: false
        default: "200"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wx-writing-on-demand
  cancel-in-progress: false

jobs:
  collect-writing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chinese OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim

      - run: npm ci
      - run: npm run check

      - name: Seed scan state from stored writing entries
        env:
          WRITING_API_URL: https://wx-job-monitor-auth.alicebob142857-wx.workers.dev
        run: npm run state:seed-writing

      - name: Collect writing examples and commentary
        env:
          AUTH_SERVICE_URL: ${{ secrets.AUTH_SERVICE_URL }}
          AUTH_SERVICE_TOKEN: ${{ secrets.AUTH_SERVICE_TOKEN }}
          WX_EXPORTER_BASE_URL: https://down.mptext.top
          WX_EXPORTER_AUTH_KEY: ${{ secrets.WX_EXPORTER_AUTH_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          CLASSIFIER_MODE: deepseek
          OCR_MAX_IMAGES: "12"
          OCR_TIMEOUT_MS: "60000"
          OCR_ARTICLE_BUDGET_MS: "90000"
          WRITING_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '336' }}
          WRITING_MAX_ARTICLES_PER_RUN: ${{ inputs.max_articles || '1000' }}
          WRITING_ARTICLE_CONCURRENCY: "3"
          WRITING_FULL_HISTORY: ${{ inputs.full_history || 'true' }}
          WRITING_HISTORY_MAX_PAGES: ${{ inputs.history_pages || '200' }}
        run: npm run collect:writing

      - name: Sync mainland-readable writing snapshot
        env:
          AUTH_SERVICE_URL: ${{ secrets.AUTH_SERVICE_URL }}
        run: npm run site:sync-writing

      - name: Persist writing scan state
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/writing/data state/writing-seen.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update writing example library"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
