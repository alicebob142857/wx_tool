name: Verify writing library

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-writing.yml"
      - "scripts/sync-writing-snapshot.ts"
      - "src/writing-topics.ts"
      - "worker/migrations/*writing_topic*.sql"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh public writing snapshot
        env:
          WRITING_API_URL: https://wx-job-monitor-auth.alicebob142857-wx.workers.dev
        run: npm run site:sync-writing

      - name: Persist public snapshot
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/writing/data/entries.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public writing snapshot"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
