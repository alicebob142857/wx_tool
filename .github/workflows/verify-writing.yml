name: Verify writing library

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-writing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh public writing snapshot
        env:
          WRITING_API_URL: https://wx-job-monitor-auth.alicebob142857-wx.workers.dev
        run: npm run site:sync-writing

      - name: Persist public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/writing/data/entries.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public writing snapshot"
            git push
          fi
